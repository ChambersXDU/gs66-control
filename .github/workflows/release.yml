name: Publish Windows preview

on:
  push:
    tags:
      - 'v*-preview.*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build CLI
        run: dotnet build src/Gs66Control.Cli/Gs66Control.Cli.csproj --configuration Release
      - name: Test with simulated hardware
        run: dotnet test tests/Gs66Control.Tests/Gs66Control.Tests.csproj --configuration Release
      - name: Simulation smoke test
        run: dotnet run --project src/Gs66Control.Cli/Gs66Control.Cli.csproj --configuration Release --no-build -- simulate
      - name: Test offline ACPI parser
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Publish self-contained Windows app
        run: ./scripts/publish-windows.ps1
      - name: Package complete app and checksum
        shell: pwsh
        run: |
          $directory = (Resolve-Path artifacts/windows-x64).Path
          $zip = Join-Path $PWD "artifacts/GS66Control-win-x64.zip"
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            $directory, $zip, [System.IO.Compression.CompressionLevel]::Optimal, $true)
          $digest = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  GS66Control-win-x64.zip" | Set-Content "$zip.sha256" -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: GS66Control-win-x64
          path: |
            artifacts/GS66Control-win-x64.zip
            artifacts/GS66Control-win-x64.zip.sha256
          if-no-files-found: error
      - name: Publish preview release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" `
              --verify-tag --draft --prerelease --title "GS66 Control $env:RELEASE_TAG" `
              --notes "Windows x64 只读诊断预览版。解压完整包后运行 windows-x64/Gs66Control.exe，无需预装 .NET。支持诊断、模拟演示与 JSON 导出；尚未进行 Windows UI 或 GS66 实机验证。"
            if ($LASTEXITCODE -ne 0) { throw "Cannot create preview release." }
          }
          gh release upload "$env:RELEASE_TAG" artifacts/GS66Control-win-x64.zip `
            artifacts/GS66Control-win-x64.zip.sha256 --clobber --repo "$env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE -ne 0) { throw "Release asset upload failed." }
          gh release edit "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" `
            --target "$env:GITHUB_SHA" --draft=false --prerelease
          if ($LASTEXITCODE -ne 0) { throw "Preview publication failed." }
